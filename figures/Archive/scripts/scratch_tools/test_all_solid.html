<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>FVM 5-Ring Solid Line Art</title>
  <script src="three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FFFFFF; overflow: hidden; width: 100vw; height: 100vh; }
    #canvas-container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const width = 1800;
    const height = 1800;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xFFFFFF);

    // Exact Camera setup from user configuration
    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
    camera.position.set(-0.01, 1.86, -8.91);
    const target = new THREE.Vector3(3.30, 0.00, 0.00);
    camera.lookAt(target);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.setClearColor(0xFFFFFF, 1.0);
    container.appendChild(renderer.domElement);

    // Geometry Parameters
    const r_small_in = 2.10;
    const r_small_out = 3.25;
    const delta_r = 1.15;
    const delta_z = 1.10;
    const gap = 0.30;
    const sweepAngleDeg = 120.0;

    const r_mother_in = r_small_out + gap; // 3.55
    const r_mother_out = r_mother_in + delta_r; // 4.70

    const r_large_in = r_mother_out + gap; // 5.00
    const r_large_out = r_large_in + delta_r; // 6.15

    const y_far = delta_z + gap; // 1.40
    const y_near = -(delta_z + gap); // -1.40

    function createRingSectorGeometry(rIn, rOut, h, sweepDeg) {
      const sweepRad = (sweepDeg * Math.PI) / 180.0;
      const startAngle = -sweepRad / 2.0;
      const endAngle = sweepRad / 2.0;

      const shape = new THREE.Shape();
      const segs = Math.max(32, Math.floor(96 * (sweepDeg / 360.0)));

      shape.absarc(0, 0, rOut, startAngle, endAngle, false);
      shape.lineTo(rIn * Math.cos(endAngle), rIn * Math.sin(endAngle));
      shape.absarc(0, 0, rIn, endAngle, startAngle, true);
      shape.lineTo(rOut * Math.cos(startAngle), rOut * Math.sin(startAngle));

      const extrudeSettings = {
        depth: h,
        bevelEnabled: false,
        curveSegments: segs
      };

      const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geo.rotateX(-Math.PI / 2);
      geo.translate(0, -h / 2, 0);
      return geo;
    }

    // Pure white occluding material with polygonOffset
    const whiteMaterial = new THREE.MeshBasicMaterial({
      color: 0xFFFFFF,
      polygonOffset: true,
      polygonOffsetFactor: 1.5,
      polygonOffsetUnits: 1.5,
      side: THREE.DoubleSide
    });

    const blackMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });

    function createCylinderBetweenPoints(p1, p2, radius) {
      const dir = new THREE.Vector3().subVectors(p2, p1);
      const len = dir.length();
      const geom = new THREE.CylinderGeometry(radius, radius, len, 8, 1, false);
      geom.translate(0, len / 2, 0);
      geom.rotateX(Math.PI / 2);
      
      const mesh = new THREE.Mesh(geom, blackMaterial);
      mesh.position.copy(p1);
      mesh.lookAt(p2);
      return mesh;
    }

    function createArcTube(radius, y, sweepDeg, tubeRadius) {
      const sweepRad = (sweepDeg * Math.PI) / 180.0;
      const startAngle = -sweepRad / 2.0;
      const endAngle = sweepRad / 2.0;
      const segs = 64;

      class ArcCurve extends THREE.Curve {
        getPoint(t) {
          const ang = startAngle + t * (endAngle - startAngle);
          return new THREE.Vector3(radius * Math.cos(ang), y, -radius * Math.sin(ang));
        }
      }

      const path = new ArcCurve();
      const geom = new THREE.TubeGeometry(path, segs, tubeRadius, 8, false);
      return new THREE.Mesh(geom, blackMaterial);
    }

    const ringSpecs = [
      { name: 'mother', rIn: r_mother_in, rOut: r_mother_out, y: 0.0, isMother: true },
      { name: 'small',  rIn: r_small_in,  rOut: r_small_out,  y: 0.0, isMother: false },
      { name: 'large',  rIn: r_large_in,  rOut: r_large_out,  y: 0.0, isMother: false },
      { name: 'far',    rIn: r_mother_in, rOut: r_mother_out, y: y_far, isMother: false },
      { name: 'near',   rIn: r_mother_in, rOut: r_mother_out, y: y_near, isMother: false }
    ];

    ringSpecs.forEach(spec => {
      // 1. Add white solid mesh for occlusion
      const geo = createRingSectorGeometry(spec.rIn, spec.rOut, delta_z, sweepAngleDeg);
      const mesh = new THREE.Mesh(geo, whiteMaterial);
      mesh.position.y = spec.y;
      scene.add(mesh);

      // 2. Add solid outlines for ALL rings
      // Mother ring: bold (tubeR = 0.024)
      // Other 4 rings: slender solid line (tubeR = 0.012)
      const tubeR = spec.isMother ? 0.024 : 0.012;
      const yTop = spec.y + delta_z / 2.0;
      const yBot = spec.y - delta_z / 2.0;
      const halfSweep = (sweepAngleDeg * Math.PI) / 360.0;

      // 4 Circular Arcs
      scene.add(createArcTube(spec.rIn,  yTop, sweepAngleDeg, tubeR));
      scene.add(createArcTube(spec.rOut, yTop, sweepAngleDeg, tubeR));
      scene.add(createArcTube(spec.rIn,  yBot, sweepAngleDeg, tubeR));
      scene.add(createArcTube(spec.rOut, yBot, sweepAngleDeg, tubeR));

      // Corner Vertices for straight edges
      const corners = [
        { t: -halfSweep, rin: spec.rIn, rout: spec.rOut },
        { t:  halfSweep, rin: spec.rIn, rout: spec.rOut }
      ];

      corners.forEach(c => {
        const p_in_top  = new THREE.Vector3(c.rin  * Math.cos(c.t), yTop, -c.rin  * Math.sin(c.t));
        const p_out_top = new THREE.Vector3(c.rout * Math.cos(c.t), yTop, -c.rout * Math.sin(c.t));
        const p_in_bot  = new THREE.Vector3(c.rin  * Math.cos(c.t), yBot, -c.rin  * Math.sin(c.t));
        const p_out_bot = new THREE.Vector3(c.rout * Math.cos(c.t), yBot, -c.rout * Math.sin(c.t));

        scene.add(createCylinderBetweenPoints(p_in_bot,  p_in_top,  tubeR));
        scene.add(createCylinderBetweenPoints(p_out_bot, p_out_top, tubeR));
        scene.add(createCylinderBetweenPoints(p_in_top, p_out_top, tubeR));
        scene.add(createCylinderBetweenPoints(p_in_bot, p_out_bot, tubeR));
      });

      // Outer cylinder silhouette generator edge (tangent to camera)
      // Camera is at (-0.01, 1.86, -8.91), dist ~ 8.91
      const sinSilh = spec.rOut / 8.91;
      if (sinSilh > 0 && sinSilh < 1) {
        const tSilh = Math.asin(sinSilh);
        if (tSilh >= -halfSweep && tSilh <= halfSweep) {
          const pSilhBot = new THREE.Vector3(spec.rOut * Math.cos(tSilh), yBot, -spec.rOut * Math.sin(tSilh));
          const pSilhTop = new THREE.Vector3(spec.rOut * Math.cos(tSilh), yTop, -spec.rOut * Math.sin(tSilh));
          scene.add(createCylinderBetweenPoints(pSilhBot, pSilhTop, tubeR));
        }
      }
    });

    renderer.render(scene, camera);
  </script>
</body>
</html>
